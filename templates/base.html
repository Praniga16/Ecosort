<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EcoSort AI — Real-Time Waste Segregation System Using MobileNetV2 Transfer Learning and Computer Vision.">
  <title>{% block title %}EcoSort AI — Real-Time Waste Segregation System{% endblock %}</title>
  
  <!-- Favicon / Styling -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  
  <!-- Lucide Icons & Chart.js CDNs -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="app-container">
    <!-- Desktop Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="{{ url_for('index') }}" class="brand-logo">
          <span class="brand-icon">♻</span>
          <div>
            <div>EcoSort AI</div>
            <div class="brand-subtitle">Smart Waste Sorting</div>
          </div>
        </a>
      </div>

      <nav class="sidebar-nav">
        <a href="{{ url_for('index') }}" class="nav-item {% if request.path == '/' %}active{% endif %}">
          <i data-lucide="layout-dashboard" class="nav-icon"></i>
          <span>Dashboard</span>
        </a>
        <a href="{{ url_for('index') }}#scannerSection" class="nav-item">
          <i data-lucide="scan" class="nav-icon"></i>
          <span>Scan Waste</span>
        </a>
        <a href="{{ url_for('history_page') }}" class="nav-item {% if request.path == '/history' %}active{% endif %}">
          <i data-lucide="history" class="nav-icon"></i>
          <span>History</span>
        </a>
        <a href="{{ url_for('analytics_page') }}" class="nav-item {% if request.path == '/analytics' %}active{% endif %}">
          <i data-lucide="bar-chart-3" class="nav-icon"></i>
          <span>Analytics</span>
        </a>
        <a href="{{ url_for('about_page') }}" class="nav-item {% if request.path == '/about' %}active{% endif %}">
          <i data-lucide="info" class="nav-icon"></i>
          <span>About Project</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="system-status-badge">
          <span class="status-dot {% if not meta.trained %}offline{% endif %}"></span>
          <span>AI Model {% if meta.trained %}Online{% else %}Not Trained{% endif %}</span>
        </div>
      </div>
    </aside>

    <!-- Mobile Header -->
    <header class="mobile-header">
      <a href="{{ url_for('index') }}" class="brand-logo">
        <span class="brand-icon">♻</span>
        <span>EcoSort AI</span>
      </a>
      <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle navigation">
        <i data-lucide="menu"></i>
      </button>
    </header>

    <!-- Main Content Area -->
    <div class="main-wrapper">
      <main class="main-content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
